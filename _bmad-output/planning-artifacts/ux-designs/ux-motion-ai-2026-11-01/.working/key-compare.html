<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flowvis — Split Comparison & Result Screen (Vector Lucide Icons)</title>
  <style>
    /*
      Spine Sections Governed:
      - DESIGN.md: Colors (Slate Cyber), Icons (Lucide via nuxt-icon), Components (split-slider, button-secondary, download-button)
      - EXPERIENCE.md: Information Architecture (/tasks/:id), Component Patterns (BeforeAfterSplitSlider), Key Flows (Hà - Online Fashion Shop Owner)
    */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #080C16;
      color: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }
    .mobile-frame {
      width: 100%;
      max-width: 412px;
      background: #0F172A;
      border: 2px solid #334155;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8), 0 0 30px rgba(6, 182, 212, 0.15);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .status-bar {
      height: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 13px;
      font-weight: 600;
      color: #94A3B8;
    }
    .dynamic-island {
      width: 110px;
      height: 24px;
      background: #000;
      border-radius: 20px;
      margin: 0 auto;
    }

    /* Lucide Icon Utility */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      vertical-align: middle;
    }

    /* Top Bar with Back */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 14px;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #F8FAFC;
      cursor: pointer;
    }
    .badge-status {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Content Area */
    .content-area {
      padding: 0 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Before/After Split Viewer Container */
    .split-viewer-card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #94A3B8;
    }

    /* Interactive Split Screen Box */
    .split-canvas {
      width: 100%;
      height: 380px;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      background: #0B0F19;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      user-select: none;
    }
    .img-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    /* Simulated Before State */
    .layer-before {
      background: radial-gradient(circle at center, #232D42 0%, #0F172A 100%);
      color: #94A3B8;
    }
    /* Simulated After State (Clipped) */
    .layer-after {
      background: radial-gradient(circle at center, #352352 0%, #151124 100%);
      color: #E9D5FF;
      clip-path: inset(0 0 0 52%);
    }
    .vector-silhouette {
      width: 120px;
      height: 200px;
      opacity: 0.85;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
    }
    .layer-tag {
      position: absolute;
      top: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
    }
    .tag-before { left: 12px; color: #94A3B8; }
    .tag-after { right: 12px; color: #22D3EE; border: 1px solid rgba(6, 182, 212, 0.4); }

    /* Split Slider Divider Line & Handle */
    .slider-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 52%;
      width: 2px;
      background: #06B6D4;
      box-shadow: 0 0 10px #06B6D4;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .slider-knob {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #06B6D4;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.8), 0 4px 8px rgba(0,0,0,0.5);
      cursor: ew-resize;
    }

    .hint-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: #64748B;
      font-weight: 600;
    }

    /* Action Buttons */
    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-download {
      width: 100%;
      min-height: 50px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #10B981 0%, #06B6D4 100%);
      color: #000;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px -3px rgba(16, 185, 129, 0.4);
    }
    .row-secondary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-action {
      min-height: 46px;
      border-radius: 12px;
      background: #1E293B;
      border: 1px solid #334155;
      color: #F8FAFC;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:42</span>
      <div class="dynamic-island"></div>
      <span>5G 100%</span>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="back-btn">
        <span class="icon">
          <!-- lucide:arrow-left -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </span>
        Studio
      </div>
      <div class="badge-status">
        <span class="icon">
          <!-- lucide:check-circle-2 -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </span>
        Đã hoàn thành
      </div>
    </div>

    <!-- Content -->
    <div class="content-area">
      <!-- Split Viewer -->
      <div class="split-viewer-card">
        <div class="viewer-header">
          <span>Chỉnh Vóc Dáng (Body Retouch)</span>
          <span style="color: #8B5CF6;">Mức 5: Tự nhiên</span>
        </div>

        <div class="split-canvas">
          <!-- Before Layer -->
          <div class="img-layer layer-before">
            <span class="layer-tag tag-before">Ảnh Gốc</span>
            <div class="vector-silhouette">
              <!-- Vector Illustration of Fashion Model Silhouette -->
              <svg viewBox="0 0 100 180" width="100%" height="100%" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="50" cy="22" r="14"/>
                <path d="M40 36 L25 75 L38 78 L42 120 L35 170 M60 36 L75 75 L62 78 L58 120 L65 170"/>
                <path d="M38 78 C42 85 58 85 62 78"/>
                <path d="M42 120 C46 128 54 128 58 120"/>
              </svg>
            </div>
            <span style="font-size: 12px; margin-top: 6px; color: #64748B;">Dáng mẫu ban đầu</span>
          </div>

          <!-- After Layer -->
          <div class="img-layer layer-after">
            <span class="layer-tag tag-after">AI Retouch</span>
            <div class="vector-silhouette">
              <!-- Vector Illustration of AI Retouched Model (Slim Waist, Balanced Curves) -->
              <svg viewBox="0 0 100 180" width="100%" height="100%" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="50" cy="22" r="14"/>
                <path d="M41 36 L28 75 L40 76 L44 120 L37 170 M59 36 L72 75 L60 76 L56 120 L63 170"/>
                <path d="M40 76 C45 80 55 80 60 76"/>
                <path d="M44 120 C47 124 53 124 56 120"/>
              </svg>
            </div>
            <span style="font-size: 12px; margin-top: 6px; color: #22D3EE;">Eo thon • Giữ chuẩn phom đầm</span>
          </div>

          <!-- Interactive Slider Divider -->
          <div class="slider-divider">
            <div class="slider-knob">
              <span class="icon">
                <!-- lucide:arrow-left-right -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
              </span>
            </div>
          </div>
        </div>

        <div class="hint-bar">
          <span class="icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </span>
          Trượt thanh ngang để so sánh Before/After trực tiếp
          <span class="icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions-stack">
        <!-- 1-Click Download No Watermark with Lucide Download Icon -->
        <button class="btn-download">
          <span class="icon">
            <!-- lucide:download -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          </span>
          Tải Ảnh HD (Không Watermark)
        </button>

        <!-- Secondary Actions with Lucide Icons -->
        <div class="row-secondary-actions">
          <button class="btn-action">
            <span class="icon">
              <!-- lucide:link -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </span>
            Sao Chép Link
          </button>
          <button class="btn-action">
            <span class="icon">
              <!-- lucide:refresh-cw -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            </span>
            Đổi Mức Độ Khác
          </button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
