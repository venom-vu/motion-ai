<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion AI — In-Context VietQR Top-up Modal (Vector Lucide Icons)</title>
  <style>
    /*
      Spine Sections Governed:
      - DESIGN.md: Colors (Slate Cyber), Icons (Lucide via nuxt-icon), Elevation & Depth (Modal Overlay, Drawer Sheet)
      - EXPERIENCE.md: Foundation, Information Architecture (VietQR Modal), Component Patterns (VietQRModal), Key Flows (Nam / Minh - Quick Topup)
    */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #080C16;
      color: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }
    .mobile-frame {
      width: 100%;
      max-width: 412px;
      background: #0F172A;
      border: 2px solid #334155;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8);
      position: relative;
      min-height: 740px;
      display: flex;
      flex-direction: column;
    }

    /* Lucide Icon Utility */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      vertical-align: middle;
    }

    /* Dimmed Background Studio Backdrop + Centered Dialog Container */
    .backdrop-studio {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 12, 22, 0.82);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    /* Centered Dialog Modal (No Drawer / Bottom Sheet) */
    .centered-dialog {
      position: relative;
      margin: auto 14px;
      width: calc(100% - 28px);
      background: #1E293B;
      border: 1.5px solid #475569;
      border-radius: 22px;
      padding: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 28px rgba(139, 92, 246, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: #F8FAFC;
    }
    .modal-sub {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 2px;
    }
    .btn-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #334155;
      border: none;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-close:hover {
      background: #475569;
      color: #FFF;
    }

    /* VietQR Display Card */
    .qr-card {
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .qr-box {
      width: 170px;
      height: 170px;
      background: #FFFFFF;
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .qr-matrix {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, #000 0px, #000 4px, #FFF 4px, #FFF 8px);
      border-radius: 6px;
      position: relative;
    }
    .qr-center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: #8B5CF6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      box-shadow: 0 0 0 3px #FFF;
    }

    /* Countdown Timer */
    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Payment Details Table */
    .pay-details {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #1E293B;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detail-label { color: #94A3B8; }
    .detail-val {
      font-weight: 700;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .copy-chip {
      background: #334155;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 11px;
      color: #22D3EE;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    /* Off-hours Note */
    .off-hours-banner {
      font-size: 11px;
      color: #94A3B8;
      background: rgba(15, 23, 42, 0.5);
      border-left: 3px solid #06B6D4;
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    /* Submit Button */
    .btn-confirm {
      width: 100%;
      min-height: 50px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #8B5CF6 0%, #06B6D4 100%);
      color: #FFF;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Dimmed Studio in background -->
    <div class="backdrop-studio"></div>

    <!-- In-Context Centered Dialog -->
    <div class="centered-dialog" role="dialog" aria-label="Nạp Credit Qua VietQR">
      <div class="modal-header">
        <div>
          <div class="modal-title">Nạp Credit Qua VietQR</div>
          <div class="modal-sub">Gói Starter 49.000đ • Nhận ngay 5.000 Credit</div>
        </div>
        <button class="btn-close" aria-label="Đóng">
          <span class="icon">
            <!-- lucide:x -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </span>
        </button>
      </div>

      <div class="qr-card">
        <div class="timer-pill">
          <span class="icon">
            <!-- lucide:clock -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </span>
          Phiên thanh toán hết hạn sau: <strong>14:45</strong>
        </div>

        <div class="qr-box">
          <div class="qr-matrix">
            <div class="qr-center-logo">
              <span class="icon">
                <!-- lucide:zap -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              </span>
            </div>
          </div>
        </div>

        <div class="pay-details">
          <div class="detail-row">
            <span class="detail-label">Số tiền:</span>
            <span class="detail-val" style="color: #34D399; font-size: 14px;">49.000 VNĐ</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Nội dung CK:</span>
            <span class="detail-val">
              NAP USR829 ORD104
              <span class="copy-chip">
                <span class="icon">
                  <!-- lucide:copy -->
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </span>
                Sao chép
              </span>
            </span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Ngân hàng:</span>
            <span class="detail-val">MB Bank • 0988888888</span>
          </div>
        </div>
      </div>

      <div class="off-hours-banner">
        <span class="icon" style="color: #06B6D4; margin-top: 1px;">
          <!-- lucide:info -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>
        </span>
        <div>Mở app ngân hàng bất kỳ, quét mã QR để điền tự động số tiền & nội dung chuyển khoản chính xác 100%.</div>
      </div>

      <button class="btn-confirm">
        <span class="icon">
          <!-- lucide:check -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        Tôi Đã Chuyển Khoản Xong
      </button>
    </div>
  </div>

</body>
</html>
