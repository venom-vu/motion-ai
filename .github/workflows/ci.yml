name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    name: Verify Monorepo (Boundaries, Lint, Typecheck, Build, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check branch path boundaries
        run: pnpm run check:boundaries
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Khởi động Postgres và Redis một lần (tránh các file test tự dựng song song)
        run: docker compose -f deploy/compose.yml up -d --wait postgres-16 redis-7

      - name: Kiểm image nestjs-api có ffprobe và ffmpeg (libx264)
        run: |
          docker build -f deploy/Dockerfile -t nestjs-api:ci .
          docker run --rm --entrypoint ffprobe nestjs-api:ci -version
          docker run --rm --entrypoint ffmpeg nestjs-api:ci -hide_banner -encoders | grep libx264

      - name: Test
        run: pnpm test

  smoke:
    name: Smoke đăng nhập, Face Swap và Body Retouch (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @flowvis/contracts run build

      - name: Khởi động Postgres và Redis một lần (tránh các file test tự dựng song song)
        run: docker compose -f deploy/compose.yml up -d --wait postgres-16 redis-7

      - name: Smoke test (stack Compose, Google, RunningHub và R2 giả; gồm smoke Face Swap và Body Retouch)
        run: pnpm --filter @flowvis/api test
        env:
          RUN_COMPOSE_E2E: '1'
