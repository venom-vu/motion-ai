name: motion-ai

services:
  postgres-16:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-motion_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-motion_user} -d $${POSTGRES_DB:-motion_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-7:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nestjs-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command:
      - sh
      - -c
      - "./apps/api/node_modules/.bin/prisma migrate deploy --config apps/api/prisma.config.ts && node apps/api/dist/main.js"
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-motion_user}:${POSTGRES_PASSWORD:-change_me_local_password}@postgres-16:5432/${POSTGRES_DB:-motion_ai}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis-7:6379}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres-16:
        condition: service_healthy
      redis-7:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  nestjs-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-motion_user}:${POSTGRES_PASSWORD:-change_me_local_password}@postgres-16:5432/${POSTGRES_DB:-motion_ai}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis-7:6379}
    depends_on:
      postgres-16:
        condition: service_healthy
      redis-7:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
