name: flowvis

services:
  postgres-16:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-flowvis}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-motion_user} -d $${POSTGRES_DB:-flowvis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-7:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nestjs-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command:
      - sh
      - -c
      - "./apps/api/node_modules/.bin/prisma migrate deploy --config apps/api/prisma.config.ts && node apps/api/dist/main.js"
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-motion_user}:${POSTGRES_PASSWORD:-change_me_local_password}@postgres-16:5432/${POSTGRES_DB:-flowvis}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis-7:6379}
      RUNNINGHUB_API_KEY: ${RUNNINGHUB_API_KEY:-}
      RUNNINGHUB_API_HOST: ${RUNNINGHUB_API_HOST:-}
      RH_BALANCE_ALERT_COINS: ${RH_BALANCE_ALERT_COINS:-27000}
      RH_BALANCE_ENDPOINT: ${RH_BALANCE_ENDPOINT:-}
      ADMIN_ADJUST_MAX: ${ADMIN_ADJUST_MAX:-30000}
      USD_VND: ${USD_VND:-25000}
      RH_COINS_PER_USD_RETAIL: ${RH_COINS_PER_USD_RETAIL:-1800}
      RH_COINS_PER_USD_STANDARD: ${RH_COINS_PER_USD_STANDARD:-3600}
      BENCHMARK_USER_EMAILS: ${BENCHMARK_USER_EMAILS:-}
      RUNNINGHUB_WORKFLOW_FACESWAP: ${RUNNINGHUB_WORKFLOW_FACESWAP:-}
      RUNNINGHUB_MODE_FACESWAP: ${RUNNINGHUB_MODE_FACESWAP:-ai-app}
      RUNNINGHUB_WORKFLOW_BODY_RESHAPE: ${RUNNINGHUB_WORKFLOW_BODY_RESHAPE:-}
      RUNNINGHUB_MODE_BODY_RESHAPE: ${RUNNINGHUB_MODE_BODY_RESHAPE:-workflow}
      RUNNINGHUB_WORKFLOW_MOTION: ${RUNNINGHUB_WORKFLOW_MOTION:-}
      RUNNINGHUB_MODE_MOTION: ${RUNNINGHUB_MODE_MOTION:-workflow}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres-16:
        condition: service_healthy
      redis-7:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health').then(r => r.json()).then(b => process.exit(b.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  nestjs-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-motion_user}:${POSTGRES_PASSWORD:-change_me_local_password}@postgres-16:5432/${POSTGRES_DB:-flowvis}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis-7:6379}
      RUNNINGHUB_API_KEY: ${RUNNINGHUB_API_KEY:-}
      RUNNINGHUB_API_HOST: ${RUNNINGHUB_API_HOST:-}
      RH_BALANCE_ALERT_COINS: ${RH_BALANCE_ALERT_COINS:-27000}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      RH_BALANCE_ENDPOINT: ${RH_BALANCE_ENDPOINT:-}
      RUNNINGHUB_WORKFLOW_FACESWAP: ${RUNNINGHUB_WORKFLOW_FACESWAP:-}
      RUNNINGHUB_MODE_FACESWAP: ${RUNNINGHUB_MODE_FACESWAP:-ai-app}
      RUNNINGHUB_WORKFLOW_BODY_RESHAPE: ${RUNNINGHUB_WORKFLOW_BODY_RESHAPE:-}
      RUNNINGHUB_MODE_BODY_RESHAPE: ${RUNNINGHUB_MODE_BODY_RESHAPE:-workflow}
      RUNNINGHUB_WORKFLOW_MOTION: ${RUNNINGHUB_WORKFLOW_MOTION:-}
      RUNNINGHUB_MODE_MOTION: ${RUNNINGHUB_MODE_MOTION:-workflow}
    depends_on:
      postgres-16:
        condition: service_healthy
      redis-7:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
